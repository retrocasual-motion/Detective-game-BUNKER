# Так же, как на сервере (ST-6). Локально у автора Docker не используется
# (решение 06.11) — этот файл проверяется в CI и пригодится при переезде.
name: bunker

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: bunker
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bunker"]
      interval: 2s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: game/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${PG_PASSWORD:-postgres}@db:5432/bunker
      # Вход и почта (6a-1): в образе пока без входа — сервис рассылки подключается в 6b
      # (тогда AUTH=link, MAIL_TRANSPORT — сервис, PUBLIC_URL — адрес игры).
      AUTH: ${AUTH:-off}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-none}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
    ports:
      - "${APP_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 3s
      retries: 40

volumes:
  pgdata:
