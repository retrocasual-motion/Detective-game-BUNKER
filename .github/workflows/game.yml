name: game

# Минуты Actions на Free ограничены (R4-02): правка только документации CI не запускает; новый
# пуш в ту же ветку отменяет прошлый прогон; e2e — только на PR (в main приходит уже проверенное).
on:
  pull_request:
    paths:
      ['game/**', '.github/workflows/game.yml', 'playtest/packs/**', '!game/docs/**', '!**/*.md']
  push:
    branches: [main]
    paths:
      ['game/**', '.github/workflows/game.yml', 'playtest/packs/**', '!game/docs/**', '!**/*.md']

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: game

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: game/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/game-web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: game/packages/game-web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Игра отвечает так же, как на сервере
        run: |
          curl -fsS localhost:8787/api/health | grep -q '"ok":true'
          # Стартовых материалов 50: лента объявлений газеты (16) снята, A-262.
          test "$(curl -fsS localhost:8787/api/materials | jq length)" = 50
          curl -fsS localhost:8787/ | grep -q 'id="root"'
      - name: Пакета игрока в образе нет (P-10)
        run: |
          docker compose exec -T app sh -c 'test ! -d /app/playtest'
          # Правила и закрытые материалы сервер читает сам, но не отдаёт как файл.
          ! curl -fsS localhost:8787/packages/content/dist/server.json | grep -q '"rules"'
          ! curl -fsS localhost:8787/server.json | grep -q '"rules"'
      - if: failure()
        run: docker compose logs
