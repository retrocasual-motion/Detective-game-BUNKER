<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<title>Узкий ярлык бюро для камеры 24 — вёрстка кодом</title>
<style>body{margin:0;background:#333}canvas{display:block;margin:8px;max-width:98vw}</style></head><body>
<canvas id="color"></canvas><canvas id="normal"></canvas><canvas id="rough"></canvas>
<script>
// Узкий ярлык бюро 48 × 12 мм — на дно камеры (решение автора 27.11: «узкий на дне… логичный размер, чтобы можно было
// что-то написать»). Те же краски, шрифты и знак, что у ярлыка ноутбука 47 (ART-64) и телефона 48 (ART-72), другая раскладка:
// знак бюро · ВЕЩЕСТВЕННОЕ ДОКАЗАТЕЛЬСТВО · Дело № 09-1128 · Предмет № 24 · Изъято 28.10.2009 (A-268) · Изъял: росчерк без имени.
// Холст 1920 × 480 = 400 пикс/см. Карты снимает tools/label_make.py: цвет, нормали, шероховатость.
const MM = 40, W = 48 * MM, H = 12 * MM, INK_PRINT = '#1C346E', PAPER = '#ece8dc';
let seed = 2424;
const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const mk = (id) => { const c = id ? document.getElementById(id) : document.createElement('canvas'); c.width = W; c.height = H; return c; };
const blob = (ctx, x, y, rx, ry, rgb, a) => { ctx.save(); ctx.translate(x, y); ctx.scale(rx, ry); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.6, `rgba(${rgb},${a * 0.45})`); g.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g; ctx.fillRect(-1, -1, 2, 2); ctx.restore(); };
async function build() {
  await Promise.all([document.fonts.load('80px "Segoe Script"'), document.fonts.load('80px "Segoe Print"'), document.fonts.load('600 44px Bahnschrift')]);
  const mark = new Image(); mark.src = '../bureau_blackwood_mark.png'; await mark.decode();
  const cc = mk('color'), c = cc.getContext('2d'), rc = mk('rough'), r = rc.getContext('2d'), gc = mk(), g = gc.getContext('2d');   // g — высота
  c.fillStyle = PAPER; c.fillRect(0, 0, W, H); r.fillStyle = 'rgb(217,217,217)'; r.fillRect(0, 0, W, H); g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) blob(c, rr(0, W), rr(0, H), rr(60, 240), rr(30, 120), rnd() < 0.5 ? '255,252,240' : '205,198,180', rr(0.04, 0.10));   // неровный тон бумаги
  // рамка и знак бюро
  c.strokeStyle = INK_PRINT; c.lineWidth = 0.22 * MM; c.strokeRect(0.55 * MM, 0.55 * MM, W - 1.1 * MM, H - 1.1 * MM);
  const mh = 8.4 * MM, mw = mh * mark.width / mark.height; c.drawImage(mark, 1.5 * MM, (H - mh) / 2, mw, mh);
  const x0 = 1.5 * MM + mw + 1.3 * MM;
  // печать: заголовок и подписи граф
  c.fillStyle = INK_PRINT; c.textBaseline = 'alphabetic';
  c.font = `600 ${1.92 * MM}px Bahnschrift, "Arial Narrow", Arial, sans-serif`; c.fillText('ВЕЩЕСТВЕННОЕ ДОКАЗАТЕЛЬСТВО', x0, 3.3 * MM);
  c.fillRect(x0, 4.0 * MM, W - x0 - 1.6 * MM, 0.16 * MM);
  c.font = `600 ${1.62 * MM}px Bahnschrift, "Arial Narrow", Arial, sans-serif`;
  const rows = [[7.25, [['Дело №', '09-1128', 11.0], ['Предмет №', '24', 5.2]]], [10.55, [['Изъято', '28.10.2009', 13.4], ['Изъял:', null, 8.2]]]];
  const ink = mk(), k = ink.getContext('2d'); k.textBaseline = 'alphabetic';
  const hand = (text, x, y, size) => { // почерк: каждая буква со своим размером, наклоном, сдвигом и нажимом
    for (const ch of text) {
      const fs = size * rr(0.94, 1.07); k.font = `${fs}px "${rnd() < 0.12 ? 'Segoe Print' : 'Segoe Script'}"`; const w = k.measureText(ch).width;
      k.save(); k.translate(x + w / 2, y + rr(-0.1, 0.1) * MM); k.rotate(rr(-0.06, 0.06)); k.transform(1, 0, rr(-0.12, 0.02), 1, 0, 0);
      k.fillStyle = `rgba(27,48,138,${rr(0.78, 0.95)})`; k.fillText(ch, -w / 2, 0); k.restore(); x += w * rr(0.86, 0.95);
    }
  };
  for (const [by, fields] of rows) {
    let x = x0;
    for (const [label, value, lineMm] of fields) {
      c.fillText(label, x, by * MM); x += c.measureText(label).width + 0.7 * MM;
      c.fillRect(x, (by + 0.32) * MM, lineMm * MM, 0.1 * MM);
      if (value) hand(value, x + 0.4 * MM, (by - 0.05) * MM, 2.15 * MM);
      else { // росчерк без читаемых букв
        const sx = x + 0.6 * MM, sy = (by - 0.1) * MM, u = MM * 0.32; k.strokeStyle = 'rgba(27,48,138,0.9)'; k.lineCap = 'round'; k.lineJoin = 'round';
        const seg = (pts, w) => { k.lineWidth = w; k.beginPath(); k.moveTo(sx + pts[0] * u, sy + pts[1] * u); for (let i = 2; i < pts.length; i += 6) k.bezierCurveTo(sx + pts[i] * u, sy + pts[i + 1] * u, sx + pts[i + 2] * u, sy + pts[i + 3] * u, sx + pts[i + 4] * u, sy + pts[i + 5] * u); k.stroke(); };
        seg([0, -0.3, 0.6, -4.4, 2.4, -4.9, 2.2, -1.6, 2.0, 0.9, 0.4, 1.2, 1.5, -1.4, 2.6, -3.6, 4.2, -3.9, 4.0, -1.5, 3.9, 0.2, 4.9, -0.4, 5.5, -1.6], 2.4);
        seg([5.5, -1.6, 6.0, -2.6, 6.5, -2.4, 6.7, -1.2, 6.9, -0.2, 7.4, -1.9, 7.9, -2.0, 8.3, -2.1, 8.2, -0.5, 8.9, -0.9, 9.6, -1.3, 9.9, -2.3, 10.6, -1.8], 2.0);
        seg([10.6, -1.8, 11.4, -1.2, 11.9, -0.6, 13.2, -1.5, 16.0, -3.3, 20.5, -3.1, 24.5, -2.2], 1.7);
      }
      x += (lineMm + 1.1) * MM;
    }
  }
  // нажим: местами паста ложится слабее
  k.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 90; i++) blob(k, rr(0, W), rr(4.5 * MM, H), rr(8, 36), rr(6, 22), '0,0,0', rr(0.12, 0.4));
  for (let i = 0; i < 600; i++) { k.fillStyle = `rgba(0,0,0,${rr(0.3, 0.9)})`; k.fillRect(rr(0, W), rr(4.5 * MM, H), rr(0.6, 1.8), rr(0.6, 1.8)); }
  k.globalCompositeOperation = 'source-over';
  c.drawImage(ink, 0, 0);
  { // паста чуть блестит и продавливает бумагу
    const src = k.getImageData(0, 0, W, H).data, ri = r.getImageData(0, 0, W, H), gi = g.getImageData(0, 0, W, H);
    for (let i = 0; i < src.length; i += 4) { const a = src[i + 3] / 255; ri.data[i] = ri.data[i + 1] = ri.data[i + 2] = 217 - a * 70; gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = 128 - a * 34; }
    r.putImageData(ri, 0, 0); g.putImageData(gi, 0, 0);
  }
  // следы обращения: края засалены пальцами, по самому краю бумага темнее; шум волокон
  for (let i = 0; i < 46; i++) { const t = rnd(), s = Math.floor(rr(0, 4)); const x = s === 0 ? 0 : s === 1 ? W : t * W, y = s === 2 ? 0 : s === 3 ? H : t * H;
    blob(c, x, y, rr(18, 60), rr(18, 60), '150,120,70', rr(0.05, 0.13)); blob(r, x, y, rr(18, 60), rr(18, 60), '150,150,150', rr(0.07, 0.18)); }
  c.strokeStyle = 'rgba(110,95,70,0.22)'; c.lineWidth = 3; c.strokeRect(0, 0, W, H);
  const noise = (ctx, amp) => { const id = ctx.getImageData(0, 0, W, H), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * amp; d[i] += n; d[i + 1] += n; d[i + 2] += n; } ctx.putImageData(id, 0, 0); };
  noise(c, 9); noise(r, 14); noise(g, 10);
  // нормали из высоты (OpenGL, +Y вверх)
  const nc = mk('normal'), n = nc.getContext('2d'), src = g.getImageData(0, 0, W, H).data, out = n.createImageData(W, H), d = out.data, K = 2.4 / 255;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const xl = Math.max(0, x - 1), xr = Math.min(W - 1, x + 1), yu = Math.max(0, y - 1), yd = Math.min(H - 1, y + 1);
    const dx = (src[(y * W + xr) * 4] - src[(y * W + xl) * 4]) * K, dy = (src[(yd * W + x) * 4] - src[(yu * W + x) * 4]) * K, inv = 1 / Math.sqrt(dx * dx + dy * dy + 1), i = (y * W + x) * 4;
    d[i] = (-dx * inv * 0.5 + 0.5) * 255; d[i + 1] = (dy * inv * 0.5 + 0.5) * 255; d[i + 2] = (inv * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
  n.putImageData(out, 0, 0);
  window.__label = { color: cc, normal: nc, rough: rc }; document.documentElement.dataset.ready = '1';
}
build();
</script></body></html>
