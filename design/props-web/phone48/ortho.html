<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#8a8a8a}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { buildPhone48 } from './phone48.js';
// #v=front|back|left|right|top|bottom &clay=1 &pbr=1 &m=1.18 — ортовиды для образца раскладки (m — поля кадра)
const P = new URLSearchParams(location.hash.slice(1));
const v = P.get('v') || 'front', clay = P.get('clay') === '1', m = parseFloat(P.get('m') || '1.18');
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.toneMapping = THREE.NoToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.setPixelRatio(1); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8a8a8a);
scene.add(new THREE.AmbientLight(0xffffff, clay ? 0.6 : 2.6));
const dl = new THREE.DirectionalLight(0xffffff, clay ? 2.2 : 0.5); scene.add(dl, dl.target);
const ph = buildPhone48(THREE, { pbr: P.get('pbr') === '1', lowPower: false, onChange: () => draw() }); scene.add(ph);
const D = ph.userData.dims;
// ровный свет без бликов: металл и глянец на время съёмки выключены, остаётся цвет
ph.traverse(o => { if (o.isMesh && o.material && o.material.isMeshPhysicalMaterial) { const mt = o.material; mt.metalnessMap = null; if (mt.metalness > 0 && !mt.map) mt.color.multiplyScalar(1.0); mt.metalness = 0; mt.roughness = 0.9; mt.roughnessMap = null; mt.clearcoat = 0; mt.iridescence = 0; mt.needsUpdate = true; } });
if (clay) { const mat = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.9 }); ph.traverse(o => { if (o.isMesh) o.material = mat; }); }
const ar = innerWidth / innerHeight, cy = D.T / 2;
const frame = (w, h) => { let hw = w / 2 * m, hh = h / 2 * m; if (hw / hh > ar) hh = hw / ar; else hw = hh * ar; return [-hw, hw, hh, -hh]; };
const V = { front: [[0, 1, 0], [0, 0, -1], D.W, D.L, [0, 0, 0]], back: [[0, -1, 0], [0, 0, -1], D.W, D.L, [0, 0, 0]],
  left: [[-1, cy, 0], [0, 1, 0], D.L, D.T, [0, cy, 0]], right: [[1, cy, 0], [0, 1, 0], D.L, D.T, [0, cy, 0]],
  top: [[0, cy, -1], [0, 1, 0], D.W, D.T, [0, cy, 0]], bottom: [[0, cy, 1], [0, 1, 0], D.W, D.T, [0, cy, 0]] }[v];
const [L, R, T, B] = frame(V[2], V[3]);
const cam = new THREE.OrthographicCamera(L, R, T, B, 0.01, 5); cam.position.set(...V[0]); cam.up.set(...V[1]); cam.lookAt(...V[4]);
dl.position.copy(cam.position).add(new THREE.Vector3(0.3, 0.3, 0.3)); dl.target.position.set(...V[4]);
function draw() { r.render(scene, cam); }
draw(); ph.userData.ready.then(() => { draw(); window.__ready = true; });
</script></body></html>
