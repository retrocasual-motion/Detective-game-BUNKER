<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script></head><body>
<script type="module">
// masks.html#size=4096 — холсты процедурного рисунка (цвет, ORM, высота, слой надписей) для tools/export_masks.py
import * as THREE from 'three';
import { buildRecorder462 } from './recorder462.js';
const size = parseInt(new URLSearchParams(location.hash.slice(1)).get('size') || '4096');
const c = buildRecorder462(THREE, { pbr: false, textureSize: size });
const out = {};
const only = new URLSearchParams(location.hash.slice(1)).get('only');   // only=L — только слой надписей (его снимают крупнее)
for (const f of ['front', 'back']) for (const k of ['A', 'O', 'H', 'L']) if (c.userData.canvases[f][k] && (!only || k === only)) out[f + '_' + k] = c.userData.canvases[f][k].toDataURL('image/png');
window.__masks = out; window.__ready = true;
</script></body></html>
